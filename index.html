<style>
  :root {
    --bg: #fdf3e7;
    --bg2: #fbe8d3;
    --panel: #fffaf2;
    --line: #eed9c0;
    --text: #5b4332;
    --dim: #a5836a;
    --accent: #e0815a;
    --accent2: #d95f43;
    --gold: #c9962e;

    --shadow: 0 8px 24px rgba(190, 130, 80, 0.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;

    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #ffe3c2 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #ffd9c0 0%, transparent 55%),

  .stage {

  /* ---------- 卡牌 ---------- */
  .hand { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 8px 0 4px; }
  .vcard {

  .mode-card {

  .mode-card.warm { border-color: #e8a37c; }
  .mode-card.serious { border-color: #8a93a3; background: #f4f5f7; }

  .stat-line b { color: var(--accent2); font-size: 18px; }

  /* ---------- 海报 ---------- */
  #posterMask {
    position: fixed;
    inset: 0;
    background: rgba(70, 45, 30, 0.55);
    backdrop-filter: blur(4px);

  .poster.warm {
    background: linear-gradient(170deg, #fff6ea, #ffe9d2 55%, #ffddc2);
    color: #6b4a33;
    border: 1px solid #f3d9bd;
  }
  .poster.serious {
    background: linear-gradient(170deg, #232a33, #2e3641 55%, #232a33);
    color: #dfe5ec;
    border: 1px solid #46505d;
  }
  .p-head { padding: 26px 22px 14px; text-align: center; }
  .p-head .pt { font-size: 21px; font-weight: 800; letter-spacing: 6px; }
  .p-head .ps { font-size: 11px; letter-spacing: 3px; opacity: .65; margin-top: 6px; }
  .p-body { padding: 0 22px 24px; }
  /* 模式专属金句 */
  .p-quote {
    margin: 2px 0 4px; padding: 12px 8px 0;
    text-align: center; font-size: 12.5px; letter-spacing: 1.5px; line-height: 1.9;
  }
  .poster.warm .p-quote { color: #b9764f; }
  .poster.serious .p-quote { color: #b9a074; }
  .p-quote::before { content: "「"; opacity: .55; }
  .p-quote::after { content: "」"; opacity: .55; }
  .p-sec-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 4px;
    margin: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .p-sec-title::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .25; }
  .p-ending {
    border-radius: 14px;
    padding: 16px;
    font-size: 13.5px;
    line-height: 2;
    text-align: justify;
  }
  .poster.warm .p-ending { background: rgba(255, 255, 255, 0.65); border: 1px solid #f3d9bd; }

  .poster.warm .p-ending .big { color: #d95f43; }
  .poster.serious .p-ending .big { color: #e8c07a; }

  .timeline { position: relative; margin-left: 8px; padding-left: 22px; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 5px; top: 6px; bottom: 6px;

    border-radius: 2px;
  }
  .poster.warm .timeline::before { background: linear-gradient(#e8a37c, #d95f43); }
  .poster.serious .timeline::before { background: linear-gradient(#8a93a3, #e8c07a); }
  .tl-item { position: relative; padding-bottom: 14px; font-size: 12.5px; line-height: 1.9; }

  }
  .poster.warm .tl-item::before { background: #d95f43; box-shadow: 0 0 0 3px #ffd9bd; }
  .poster.serious .tl-item::before { background: #e8c07a; box-shadow: 0 0 0 3px #3a4450; }
  .tl-item .tl-t { font-weight: 800; letter-spacing: 1px; }
  .poster.warm .tl-item .tl-t { color: #c25a3a; }
  .poster.serious .tl-item .tl-t { color: #e8c07a; }
  .tl-item .tl-d { opacity: .82; }

  .p-foot { display: flex; gap: 14px; align-items: center; margin-top: 22px; }
  .p-qr {
    flex: 0 0 108px;
    width: 108px; height: 108px;
    border-radius: 12px;
    background: #fff;
    padding: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .p-qr img { width: 100%; height: 100%; display: block; }
  .p-invite { flex: 1; font-size: 12.5px; line-height: 2; }
  .p-invite .b { font-weight: 800; font-size: 14px; letter-spacing: 1px; display: block; margin-bottom: 4px; }
  .p-stat { margin-top: 16px; text-align: center; font-size: 12px; opacity: .75; letter-spacing: 1px; }
  .p-close-row { text-align: center; margin-top: 18px; }
  .p-close-row .btn { margin-top: 0; }
  .p-tip { text-align: center; font-size: 11px; opacity: .55; margin-top: 10px; }

  /* ---------- 双主题：严肃（冷色+线条） / 温暖（暖色+圆圈） ---------- */
  .decor { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  header, main { position: relative; z-index: 1; }
  .deco-circle { position: absolute; border-radius: 50%; }
  .deco-line { position: absolute; height: 2px; border-radius: 2px; transform-origin: left center; }

  body.theme-serious {
    --bg: #edf0f4;
    --bg2: #dde3ec;
    --panel: #f8fafc;
    --line: #c2ccd9;
    --text: #3b4453;
    --dim: #7e8b9d;
    --accent: #5d7fa3;
    --accent2: #3f5d82;
    --gold: #7e8b9d;
    --card-bg: #ffffff;
    --shadow: 0 8px 24px rgba(70, 95, 125, 0.16);
    background:
      radial-gradient(1200px 600px at 80% -10%, #dde6f0 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #d3dce8 0%, transparent 55%),
      linear-gradient(160deg, #edf0f4, #dde3ec);
  }
  body.theme-serious .brand { color: var(--accent2); }
  body.theme-serious .game-title { color: var(--accent2); }
  body.theme-serious .mode-card.serious { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(63, 93, 130, 0.15); }

  body.theme-warm .mode-card.warm { box-shadow: 0 0 0 3px rgba(217, 95, 67, 0.15); }

  body, .stage, .vcard, .mode-card, .btn, .brand, .game-title, .prompt b, .stat-line b {
    transition: background .6s ease, color .6s ease, border-color .6s ease, box-shadow .6s ease;
  }

  /* ---------- 彩蛋强化弹窗 ---------- */
  @keyframes egFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes egPop { 0% { opacity: 0; transform: scale(.84) translateY(22px); } 62% { opacity: 1; transform: scale(1.05) translateY(0); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes egSpin { to { transform: rotate(360deg); } }
  @keyframes egGlow { 0%, 100% { box-shadow: 0 0 0 6px rgba(255,214,138,.30), 0 10px 24px rgba(180,90,20,.35); } 50% { box-shadow: 0 0 0 12px rgba(255,214,138,.16), 0 10px 30px rgba(180,90,20,.5); } }
  .egg-mask {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(58, 36, 22, .58);
  }
  .egg-mask.show { display: flex; animation: egFade .3s ease both; }
  .egg-card {
    position: relative; width: min(480px, 94vw); max-height: 88vh; overflow-y: auto;
    text-align: center; padding: 32px 26px 24px; border-radius: 22px;
    background: linear-gradient(165deg, #fff7e8, #ffe3c2);
    border: 2px solid #e8b06a;
    box-shadow: 0 26px 70px rgba(120, 60, 20, .42);
    animation: egPop .55s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .egg-rays {
    position: absolute; left: 50%; top: 84px; width: 460px; height: 460px;
    margin-left: -230px; margin-top: -230px; pointer-events: none;
    background: conic-gradient(from 0deg, rgba(255,196,84,.34) 0 5deg, transparent 5deg 28deg);
    animation: egSpin 16s linear infinite;
  }
  .egg-badge {
    position: relative; width: 96px; height: 96px; margin: 0 auto 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 42px;
    background: radial-gradient(circle at 34% 28%, #ffdc93, #df8728);
    animation: egGlow 2.4s ease-in-out infinite;
  }
  .egg-kicker { font-size: 12px; letter-spacing: 6px; color: #b4712a; font-weight: 700; }
  .egg-title { font-size: 22px; font-weight: 800; color: #8a4a17; margin: 8px 0 2px; letter-spacing: 2px; }
  .egg-ach {
    display: inline-block; margin: 14px auto 2px; padding: 9px 20px; border-radius: 999px;
    background: #8a4a17; color: #ffe9c4; font-weight: 800; letter-spacing: 3px; font-size: 14px;
  }
  .egg-text { margin-top: 16px; font-size: 14.5px; line-height: 2; color: #6d4522; text-align: left; white-space: pre-line; }
  .egg-btn { margin-top: 20px; }
  .egg-btn .btn { margin-top: 0; }
  .p-ach { margin-top: 16px; text-align: center; }
  .p-ach .p-ach-item {

  /* 海报上的成就收集进度 */
  .p-achbar { border-radius: 14px; padding: 14px 16px; }
  .poster.warm .p-achbar { background: rgba(255,255,255,.65); border: 1px solid #f3d9bd; }
  .poster.serious .p-achbar { background: rgba(255,255,255,.06); border: 1px solid #46505d; }

  .poster.serious .p-achbar-track { background: #3a4450; }
  .p-achbar-track > i { display: block; height: 100%; border-radius: 99px; }
  .poster.warm .p-achbar-track > i { background: #d95f43; }
  .poster.serious .p-achbar-track > i { background: #e8c07a; }
  .p-achbar-icons { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }
  .p-ach-ico {

  .p-ach-new { margin-top: 12px; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
  .poster.warm .p-ach-new { color: #c25a3a; }
  .poster.serious .p-ach-new { color: #e8c07a; }

  /* ---------- 成就墙 ---------- */
  .ach-entry {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 18px;
    padding: 9px 20px; border-radius: 999px; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    border: 1px dashed var(--line); background: transparent; color: var(--muted, var(--text));
    opacity: .82; transition: transform .18s ease, opacity .18s ease;
  }
  .ach-entry:hover { opacity: 1; }
  .ach-entry:active { transform: scale(.96); }
  .ach-entry .ach-dot { width: 7px; height: 7px; border-radius: 50%; background: #df8728; box-shadow: 0 0 8px rgba(223,135,40,.8); }
  .ach-mask {
    position: fixed; inset: 0; z-index: 70; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(58, 36, 22, .6);
  }
  .ach-mask.show { display: flex; animation: egFade .3s ease both; }
  .ach-card {
    position: relative; width: min(460px, 94vw); max-height: 88vh; overflow-y: auto;
    padding: 26px 22px 20px; border-radius: 22px; text-align: center;
    background: linear-gradient(165deg, #fff8ea, #ffe6c8);
    border: 2px solid #e8b06a;
    box-shadow: 0 26px 70px rgba(120, 60, 20, .42);
    animation: egPop .5s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .ach-hd { font-size: 20px; font-weight: 800; color: #8a4a17; letter-spacing: 4px; }
  .ach-prog { margin-top: 6px; font-size: 12.5px; color: #a9793c; letter-spacing: 1px; }
  .ach-bar { margin: 12px auto 4px; width: 78%; height: 7px; border-radius: 999px; background: rgba(160,110,50,.18); overflow: hidden; }
  .ach-bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffca6a, #df8728); transition: width .6s ease; }
  .ach-grid { margin-top: 16px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .ach-item {
    display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 14px 16px; border-radius: 16px;
    background: rgba(255,255,255,.72); border: 1px solid #f0d3a6;
  }
  .ach-item.locked { background: rgba(238,226,208,.55); border-style: dashed; border-color: #dcc19c; }
  .ach-ico {
    flex: 0 0 52px; width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    background: radial-gradient(circle at 34% 28%, #ffdc93, #df8728);
    box-shadow: 0 6px 16px rgba(180,90,20,.28);

  .ach-item.locked .ach-ico { background: #e3d6c2; box-shadow: none; filter: grayscale(1); opacity: .7; }
  .ach-name { font-size: 15.5px; font-weight: 800; color: #8a4a17; letter-spacing: 1px; }
  .ach-item.locked .ach-name { color: #a08a70; }
  .ach-sub { margin-top: 4px; font-size: 12.5px; line-height: 1.7; color: #8b6a48; }
  .ach-item.locked .ach-sub { color: #a8927a; font-style: italic; }
  .ach-close { margin-top: 18px; }

  @media (max-width: 560px) {
    .game-title { font-size: 25px; letter-spacing: 7px; }
    .vcard { min-width: 44%; padding: 15px 10px; font-size: 16px; }
    .stage { padding: 20px 16px; }
  }
</style>

  /* ================= 游戏状态 ================= */
  var G = {

  var app = document.getElementById("app");

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function sample(arr, n) {
    var a = arr.slice(), out = [];
    while (out.length < n && a.length) {
      out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]);
    }
    return out;
  }
  function stage(html) {
    app.innerHTML = '<div class="stage">' + html + "</div>";
    window.scrollTo({ top: 0, behavior: "smooth" });

  }
  function continueBtn(label, fn) {

        el.style.top = (Math.random() * 100) + "%";

          el.style.background = "rgba(" + c + ", " + (0.06 + Math.random() * 0.08).toFixed(2) + ")";

    }

  function sceneRound() {
    var cards = G.hand.map(function (c) { return cardHtml(c, true); }).join("");
    stage(
      '<div class="center"><span class="round-tag">第 ' + G.round + " 轮 · 剩余 " + G.hand.length + ' 张</span></div>' +
      '<div class="prompt">这是你现在所拥有的，<br>请选择一个你认为<b>最不重要</b>的，舍弃它：</div>' +
      '<div class="hand">' + cards + "</div>"
    );
    var btns = app.querySelectorAll(".vcard");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function () {
        onDiscard(this.getAttribute("data-card"));
      });

  function onDiscard(c) {
    /* 只剩两张时：先问「你想清楚了吗？」——给玩家一个反悔的台阶 */
    if (G.hand.length === 2) { askConfirm(c); return; }
    applyDiscard(c);
  }

  function askConfirm(c) {
    G.yesterday = G.hand.slice();   /* 回溯快照：最后两张 */
    stage(
      '<div class="center"><span class="round-tag">最后两张</span></div>' +
      '<div class="prompt">这是你仅剩的两张牌：</div>' +
      '<div class="hand">' + G.hand.map(function (x) { return cardHtml(x, false); }).join("") + "</div>" +
      '<div class="prompt" style="margin-top:20px">你正要舍弃 <b>「' + esc(c) + '」</b>。<br>这意味着它之后就永远不在你手里了。</div>' +
      '<div class="prompt" style="margin-top:14px"><b>你想清楚了吗？</b></div>' +
      '<div class="btn-row">' +
      '  <button class="btn" id="cfmYes">想清楚了</button>' +
      '  <button class="btn ghost" id="cfmNo">我再想想</button>' +
      "</div>"
    );
    document.getElementById("cfmYes").addEventListener("click", function () { applyDiscard(c); });
    document.getElementById("cfmNo").addEventListener("click", function () {
      stage('<div class="narrative">你把手收了回来。<br>有些决定，值得多想一会儿。</div>');
      continueBtn("重新选择", sceneRound);
    });
  }

  function applyDiscard(c) {
    if (G.hand.length === 3 && PENALTY_TEXT[c]) G.before = G.hand.slice();
    G.track.push(c);
    var idx = G.hand.indexOf(c);
    if (idx >= 0) G.hand.splice(idx, 1);

    var msgs = [];
    if (EFFECT_TEXT[c]) msgs.push(EFFECT_TEXT[c]);
    var isPenalty = !!PENALTY_TEXT[c];

    if (isPenalty) {
      msgs.push(PENALTY_TEXT[c]);
      /* 与原逻辑一致：本回合额外失去一张 */
      if (G.hand.length === 1) G.lastchoice = c;   /* 舍弃后仅剩1张时被抢 → 失去一切 */
      if (G.hand.length > 0) {
        var extra = sample(G.hand, 1)[0];
        G.hand.splice(G.hand.indexOf(extra), 1);
        msgs.push(PENALTY_EXTRA + "「" + extra + "」");
      }
    } else if (!EFFECT_TEXT[c]) {
      msgs.push("你放下了「" + c + "」，你认为有比这更重要的事情值得追求。");
    }

    showMsgs(msgs, function () {
      if (G.hand.length > 1) {
        G.round++;
        sceneRound();
      } else if (G.hand.length === 1) {
        G.finalCard = G.hand[0];
        G.finalSource = "elimination";
        sceneKeptEnding();
      } else {
        G.finalSource = "lost";
        sceneLostEnding();
      }
    });
  }

  /* 依次展示若干段文字，每段之间“点击继续” */
  function showMsgs(msgs, done) {
    var i = 0;
    function next() {
      if (i >= msgs.length) { done(); return; }
      stage('<div class="narrative">' + esc(msgs[i]).replace(/\n/g, "<br>") + "</div>");
      i++;
      continueBtn("点击继续", next);
    }
    next();
  }

    continueBtn("点击继续", function () { sceneReview(i + 1); });
  }

  /* ================= 回溯（时间倒流）+ 两难抉择 + 彩蛋 ================= */
  function snapshot() {
    if (G.before && G.before.length === 3) return G.before;
    return G.yesterday;
  }

  function checkTrackEgg(done) {
    var t = G.track;
    var egg = null;
    if (hitTriple(t)) {
      if (G.finalCard === "社会贡献") egg = EGG_JIAO;
      else if (G.finalCard === "国家安全") egg = EGG_YUE;
    }
    if (egg) showEgg(egg, done); else done();
  }

  /* 轨迹里只要「舒适生活 → 休闲自由 → 家庭幸福」按先后顺序出现过即可（不要求连续、中间可夹别的牌） */
  function hitTriple(t) {
    var a = t.indexOf("舒适生活");
    var b = t.indexOf("休闲自由");
    var c = t.indexOf("家庭幸福");
    return a >= 0 && b > a && c > b;
  }

  function sceneCallback() {
    stage(
      '<div class="prompt"><b>你有一次回溯的机会</b></div>' +
      '<div class="narrative">回到上一次选择前，是否选择时间倒流？</div>' +
      '<div class="btn-row">' +
      '  <button class="btn" id="cbYes">是，回到那个瞬间</button>' +
      '  <button class="btn ghost" id="cbNo">不了，谢谢</button>' +
      "</div>"
    );
    document.getElementById("cbYes").addEventListener("click", sceneRewind);
    document.getElementById("cbNo").addEventListener("click", function () {
      stage('<div class="narrative">你放弃了时间倒流的机会，<br>因为你相信，未来比过去更值得追求。</div>');
      continueBtn("点击继续", function () { showDilemma(sceneFinal); });
    });
  }

  function sceneRewind() {
    var snap = snapshot();
    if (!snap || snap.length < 2) { showDilemma(sceneFinal); return; }
    G.rewound = true;   /* 只要选择了时间倒流，就记为回溯过 */
    stage(
      '<div class="center"><span class="round-tag">时 间 倒 流</span></div>' +
      '<div class="prompt">这是你那时所拥有的：</div>' +
      '<div class="hand">' + snap.map(function (x) { return cardHtml(x, true); }).join("") + "</div>" +
      '<div class="prompt" style="margin-top:18px">这一次，你决定将哪一张视为你<b>最重要</b>的牌？</div>'
    );
    var btns = app.querySelectorAll(".vcard");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function () {
        var pick = this.getAttribute("data-card");
        /* 只有真正改选了另一张牌，最终牌才算「来自回溯」；
           若回溯后仍选回原来那张，最终牌依旧由淘汰序列决定 */
        var prev = G.finalCard;
        G.finalCard = pick;
        G.finalSource = (pick === prev) ? "elimination" : "rewind";
        var e = KEPT_ENDING[pick];
        var txt = e ? e.text.replace("你的“人生观”和", "你的选择和").replace("很类似", "的“人生观”很相似") : "";
        stage('<div class="narrative">' + esc(txt) + "</div>");
        continueBtn("点击继续", function () { showDilemma(sceneFinal); });
      });
    }
  }

  function showDilemma(done) {
    var snap = snapshot();
    if (!snap || snap.length < 2) { done(); return; }
    var texts = [];
    for (var i = 0; i < snap.length; i++) {
      for (var j = i + 1; j < snap.length; j++) {
        var t = dilemmaText(snap[i], snap[j]);
        if (t) texts.push(t);
      }
    }
    var finish = function () {
      /* 林觉民彩蛋：只要玩家选了「时间倒流」，回到家庭幸福与社会贡献的两难里，
         无论最后留下哪一张，都触发 */
      if (G.rewound && snap.indexOf("社会贡献") >= 0 && snap.indexOf("家庭幸福") >= 0) {
        showEgg(EGG_LIN, done);
      } else {
        done();
      }
    };
    if (!texts.length) { finish(); return; }
    showMsgs(texts, finish);
  }

  function recordResultLocal() {
    /* 本地兜底统计（云端不可用时使用） */
    var mine = G.finalCard ? [G.finalCard] : [];
    var all = SEED_RESULTS.slice();
    try {
      var local = JSON.parse(localStorage.getItem("efco_results") || "[]");
      all = all.concat(local);
      local.push(mine);
      localStorage.setItem("efco_results", JSON.stringify(local));
    } catch (e) {}
    all.push(mine);
    var same = 0;
    for (var i = 0; i < all.length; i++) {
      if (JSON.stringify(all[i]) === JSON.stringify(mine)) same++;
    }
    return (same / all.length * 100).toFixed(2) + "%";
  }

  function recordResult(done) {
    /* 优先上报云端并按全量云端数据统计；失败时退回本地统计 */
    var mine = G.finalCard || "";   /* 空字符串 = 失去一切 */
    if (!cloud) { done(recordResultLocal()); return; }
    cloud.database.from("game_results").insert({
      final_card: mine,
      lost_all: !G.finalCard,
      mode: G.mode,
      track: G.track.join("→"),
      achievements: G.achievements.join("、"),   /* 本局触发的彩蛋，多枚用「、」分隔 */
      rewound: !!G.rewound,                       /* 是否用过时间倒流 */
      final_source: G.finalSource || (G.finalCard ? "elimination" : "lost"),  /* 最终牌来源 */
      source: "web"
    }).then(function () {
      return Promise.all([
        cloud.database.from("game_results").select("*", { count: "exact", head: true }),
        cloud.database.from("game_results").select("*", { count: "exact", head: true }).eq("final_card", mine)
      ]);
    }).then(function (rs) {
      var total = rs[0].count, same = rs[1].count;
      if (total && same != null) {
        done((same / total * 100).toFixed(2) + "%");
      } else {
        done(recordResultLocal());
      }
    }).catch(function () {
      done(recordResultLocal());
    });
  }

  function sceneFinal() {
    stage(
      '<div class="prompt"><b>说在最后的话：</b></div>' +
      '<div class="narrative">' + esc(FINAL_WORDS) + "</div>" +
      '<div class="divider"></div>' +
      '<div class="stat-line" id="statLine">正在汇总全网玩家数据…</div>' +
      '<div class="prompt" style="margin-top:26px"><b>是否查看你的结果报告？</b></div>' +
      '<div class="btn-row">' +
      '  <button class="btn" id="btnYes">查看结果报告</button>' +
      '  <button class="btn ghost" id="btnNo">不了，谢谢</button>' +
      "</div>"
    );
    var g2 = loadAch();
    var e2 = document.createElement("button");
    e2.className = "ach-entry";
    e2.innerHTML = '<span class="ach-dot"></span>看看成就墙 · ' + g2.length + " / " + ACH_LIST.length;
    e2.addEventListener("click", openAchWall);
    app.querySelector(".stage").appendChild(e2);

    recordResult(function (percent) {
      var el = document.getElementById("statLine");
      if (el) el.innerHTML = "有 <b>" + percent + "</b> 的人和你有相似的人生观";
      document.getElementById("btnYes").addEventListener("click", function () { showPoster(percent); });
    });
    document.getElementById("btnNo").addEventListener("click", function () {
      stage(
        '<div class="lead">感谢你的认真作答。<br>愿你心怀暖意，旅途愉快。</div>' +
        '<div class="stat-line">随时刷新页面，可以再来一局。</div>'
      );
      continueBtn("再来一局", sceneStart);
    });
  }

  /* ================= 海报 ================= */
  /* 海报文案：两套语气，随复盘模式切换 */

      keptTail: "」",

      tlTitle: "你放下它们的顺序",
      roundWord: "放下",
      achTitle: "你点亮的光",
      achLabel: "已点亮",
      inviteB: "扫码，邀 TA 也来走一遍",
      inviteT: "每个人都在取舍里慢慢长成自己。看看 Ta 最后会留下什么。",
      statTail: "愿你不孤单"
    },
    "严肃模式": {
      sub: "人 生 取 舍 · 以 史 为 镜",
      quote: "所有舍弃都有代价，所有代价都有回声。",
      endTitle: "最终结局",
      keptBig: "你最终坚守了「",
      keptTail: "」",
      lostBig: "最终结局：失去了一切",
      tlTitle: "舍 弃 轨 迹",
      roundWord: "舍弃",
      achTitle: "成 就 收 集",
      achLabel: "成就收集",
      inviteB: "扫码，让 TA 也来受一次审视",
      inviteT: "八样东西，最终只能留一样。历史会记住每一次割舍。",
      statTail: "与你同路的人"
    }
  };

  function showPoster(percent) {
    var warm = G.mode !== "严肃模式";
    var poster = document.getElementById("poster");
    poster.className = "poster " + (warm ? "warm" : "serious");
    var C = POSTER_COPY[warm ? "温暖模式" : "严肃模式"];

    var endingHtml;
    if (G.finalCard) {
      var e = KEPT_ENDING[G.finalCard];
      endingHtml =
        '<span class="big">' + C.keptBig + esc(G.finalCard) + C.keptTail + "</span>" +
        "与 <b>" + esc(e.figure) + "</b> 相似的人生观 —— " + esc(e.text);
    } else {
      var s = LOSE_STORY[G.lastchoice];
      endingHtml =
        '<span class="big">' + C.lostBig + "</span>" +
        "因为最后舍弃了 <b>「" + esc(G.lastchoice) + "」</b>，你失去了所有本拥有的全部。" +
        (s ? "<br>" + esc(s.moral) : "");
    }

    var tl = G.track.map(function (c, i) {
      return '<div class="tl-item"><div class="tl-t">第 ' + (i + 1) + " 轮 · " + C.roundWord + "「" + esc(c) + "」</div>" +
        '<div class="tl-d">' + esc(REVIEW[G.mode][c]) + "</div></div>";
    }).join("");

    /* 成就收集进度：始终显示（含本局新解锁的高亮） */
    var achAll = loadAch();
    var achPct = Math.round(achAll.length / ACH_LIST.length * 100);
    var achIcons = ACH_LIST.map(function (a) {
      var has = achAll.indexOf(a.key) !== -1;
      return '<span class="p-ach-ico' + (has ? "" : " off") + '" title="' + esc(a.key) + '">' + (has ? a.icon : "🔒") + "</span>";
    }).join("");
    var achHtml =
      '<div class="p-sec-title">' + C.achTitle + "</div>" +
      '<div class="p-achbar">' +
      '  <div class="p-achbar-top"><span>' + C.achLabel + ' <b class="n">' + achAll.length + "</b> / " + ACH_LIST.length + "</span><span>" + achPct + "%</span></div>" +
      '  <div class="p-achbar-track"><i style="width:' + achPct + '%"></i></div>' +
      '  <div class="p-achbar-icons">' + achIcons + "</div>" +
      (G.achievements.length
        ? '<div class="p-ach-new">本局解锁 ' + G.achievements.map(function (a) { return "★ " + esc(a); }).join(" · ") + "</div>"
        : "") +
      "</div>";

    poster.innerHTML =
      '<div class="p-head"><div class="pt">极限五选一</div><div class="ps">' + C.sub + "</div></div>" +
      '<div class="p-body">' +
      '  <div class="p-quote">' + C.quote + "</div>" +
      '  <div class="p-sec-title">' + C.endTitle + "</div>" +
      '  <div class="p-ending">' + endingHtml + "</div>" +
      '  <div class="p-sec-title">' + C.tlTitle + "</div>" +
      '  <div class="timeline">' + tl + "</div>" +
      achHtml +
      '  <div class="p-foot">' +
      '    <div class="p-qr"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAAFAAQMAAAD3XjfpAAAABlBMVEX///8AAABVwtN+AAAACXBIWXMAAA7EAAAOxAGVKw4bAAACaUlEQVRoge2aPZKrQAyE5dqA0EfgKBwNjsZR5giEBJT1plsawK7dCJmXSMEahm+SFa2/QSQtxtStXj7Xn1f96Zeu3k/S6/Y4PU0wCJzwb3+ojPNztY0LVkYtXIb9JBgJDgoX2Ip75gXewFF1TfAboK2ozkIPyVC6LcEvgjJQAtUzuj4Ye9Y/XJjgTSAecqVmA4qFmpmG8lc0S/AS2BItskINUjr3Dex+z9cJXgIPgyTqxpk3fLzJr5bgFdBW6IKFaWAoT3UpwFFTddSWYDDImAMp1Mu554oH+/r7PGsmwdtA1Pq8PFoA9QKpZgNlgWraSTAMZOk/zmwBqB3u663n9QI1wSgQ2cANUkCQWtvya+95E4wCSeBdh2dove2arbKv1h1BKsHLIFywMMiYKxBz2lTBpCAeexK8F0S+XT62MkghOaAVcwklGAQKS1B1cbwsDVMrvQWpcrgwwQDQxjgipyaXMaqNcWyEn2AciCfec6GypGfMYWzB5Oi5ErwZrC3AxmBlx1c+WKvpGxKSvSJNMAg8jy65kWmAUvoMUglGgLoX+Zwq4N3HNAEVaWty99I1wQBwEg5qcG5FF/iADZPN1vO2QjPBEHBwzwxcwbsvPqtHDph63WNPgjeDxdKv+wwnuTw+LB3pcnyrkGAAuNvo854WpLRQK2M7oE0wBlS3j69xWv0JUE+nKQleBif83Y++qQhqAOCbZxIMAgf/GsdL+Xrr54UWe/StG07wv4CUho8faDhkKZLgd0AbYcIQrMZ9uH80uQmGgB6kGji3nkv8WwVNMBR04/dmNijjrYiPcd4/DknwNjAtwv4BnxMnaGpoqC0AAAAASUVORK5CYII=" alt="扫码来玩"></div>' +
      '    <div class="p-invite"><span class="b">' + C.inviteB + "</span>" + C.inviteT + "</div>" +
      "  </div>" +
      '  <div class="p-stat">有 ' + esc(percent) + " 的人和你有相似的人生观 · " + C.statTail + "</div>" +
      "</div>";

    document.getElementById("posterImgBox").style.display = "none";
    document.getElementById("posterMask").classList.add("show");
  }

  /* 把海报 DOM 渲染成 PNG：电脑端直接下载，手机端展示图片供长按保存 */
  function savePoster() {
    var btn = document.getElementById("posterSave");
    var posterEl = document.getElementById("poster");
    if (typeof html2canvas === "undefined") {
      document.getElementById("posterTip").textContent = "图片组件未加载成功，请直接截图保存海报";
      return;
    }
    btn.disabled = true;
    btn.textContent = "正在生成图片…";
    html2canvas(posterEl, { scale: 2, useCORS: true, backgroundColor: null }).then(function (canvas) {
      var url = canvas.toDataURL("image/png");
      /* 手机端：显示图片，长按即可存相册 */
      document.getElementById("posterImg").src = url;
      document.getElementById("posterImgBox").style.display = "block";
      /* 电脑端：同时触发下载 */
      canvas.toBlob(function (blob) {
        if (!blob) return;
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "极限五选一-结果报告.png";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      }, "image/png");
      btn.disabled = false;
      btn.textContent = "保存海报到相册";
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = "保存海报到相册";
      document.getElementById("posterTip").textContent = "生成失败，请直接截图保存海报";
    });
  }
  document.getElementById("posterSave").addEventListener("click", savePoster);
  document.getElementById("posterClose").addEventListener("click", function () {
    document.getElementById("posterMask").classList.remove("show");
    stage(
      '<div class="lead">报告已生成，欢迎把海报分享给朋友。<br>愿你心怀暖意，旅途愉快。</div>'
    );
    continueBtn("再来一局", sceneStart);
  });

  sceneStart();
})();
